<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stronger Cast — Vídeo de lançamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--g:#e2b877;--bg:#06060a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff}
#view{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.b{position:absolute;border-radius:50%;filter:blur(150px);opacity:.55;width:900px;height:900px;left:0;top:0;margin:-450px 0 0 -450px}
#b1{background:#e2b877}#b2{background:#5b3df5}#b3{background:#1fa3ff}
#pw{position:absolute;left:0;top:0;width:400px;height:820px;z-index:5;transform-style:preserve-3d}
#tilt,#fl{position:absolute;inset:0;transform-style:preserve-3d}
.phone{position:absolute;left:0;top:0;width:400px;height:820px;transform-style:preserve-3d}
.phone .body{position:absolute;inset:0;border-radius:68px;background:linear-gradient(145deg,#5a5c63,#1b1c20 35%,#3a3c42 60%,#15161a);box-shadow:0 60px 120px rgba(0,0,0,.7),0 0 0 2px #0b0b0d inset}
.phone .e1,.phone .e2{position:absolute;inset:0;border-radius:68px;background:#18191c}
.phone .e1{transform:translateZ(-7px)}.phone .e2{transform:translateZ(-14px);background:#0e0e10}
.phone .glass{position:absolute;inset:12px;border-radius:56px;background:#000;overflow:hidden;transform:translateZ(1px)}
.phone .glass:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(255,255,255,.05));pointer-events:none;z-index:9}
.isl{position:absolute;left:50%;top:14px;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px;z-index:8}
.scr{position:absolute;inset:0;background:#0b0b10;padding:0}
.sb{display:flex;justify-content:space-between;padding:20px 34px 0;font-size:15px;font-weight:700}
.pad{padding:18px 22px}
.logo{width:var(--w)}
.logo img{width:100%;display:block}
.lbl{font-size:13px;color:#9a9aa6;margin:16px 0 8px;font-weight:600}
.hero{border-radius:26px;padding:20px;height:230px;background:linear-gradient(150deg,#e2b877,#9b4dff 70%,#2b1a6b);position:relative;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}
.hero small{font-size:12px;font-weight:700;opacity:.85}.hero h4{margin:6px 0 14px;font-size:24px;line-height:1.12;font-weight:800}
.btn{display:inline-block;background:#fff;color:#000;border-radius:30px;padding:10px 20px;font-weight:700;font-size:14px;align-self:flex-start}
.mini{display:flex;gap:12px}.mini div{flex:1;height:96px;border-radius:18px;background:linear-gradient(160deg,#23233a,#12121c);padding:12px;box-sizing:border-box;font-size:13px;font-weight:600;display:flex;align-items:flex-end}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(20,20,28,.95);display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#8a8a98;font-weight:600}
.tabs .on{color:var(--g)}
.vid{height:206px;border-radius:24px;background:linear-gradient(140deg,#2a1a5e,#c68a3c);position:relative;display:grid;place-items:center}
.play{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#000;font-size:26px;padding-left:5px;box-sizing:border-box}
.pill{position:relative;display:flex;margin:18px auto 0;width:236px;height:44px;border-radius:30px;background:#1a1a24;font-weight:700;font-size:14px}
.pill span{flex:1;display:grid;place-items:center;position:relative;z-index:2}
.pill i{position:absolute;left:4px;top:4px;width:114px;height:36px;border-radius:30px;background:var(--g);z-index:1}
.pill span:first-of-type{color:#000}
.wave{display:flex;gap:4px;align-items:center;height:90px;margin:20px 0 6px}
.wave i{flex:1;border-radius:4px;background:linear-gradient(var(--g),#9b4dff);height:var(--h);animation:wv 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wv{to{transform:scaleY(.3)}}
.track{height:6px;border-radius:4px;background:#23232f;overflow:hidden}.track i{display:block;height:100%;width:var(--p,38%);background:var(--g)}
.ctr{display:flex;justify-content:center;gap:30px;font-size:26px;margin-top:20px;align-items:center}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #1b1b27}
.row .th{width:64px;height:64px;border-radius:16px;flex:none;background:linear-gradient(140deg,#e2b877,#5b3df5)}
.row:nth-child(3n) .th{background:linear-gradient(140deg,#1fa3ff,#5b3df5)}.row:nth-child(3n+2) .th{background:linear-gradient(140deg,#ff8a5c,#9b4dff)}
.row b{font-size:15px;line-height:1.2;display:block}.row small{color:#8a8a98;font-size:12px}
.h2{font-size:30px;font-weight:800;margin:14px 0 4px}
.home{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:30px 22px;opacity:.5}
.home div{aspect-ratio:1;border-radius:16px;background:linear-gradient(140deg,#2c2c40,#15151f)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#17171f;border-radius:34px 34px 0 0;padding:26px 24px 34px;text-align:center;height:470px;box-sizing:border-box}
.ico{width:96px;height:96px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(145deg,#e2b877,#5b3df5);display:grid;place-items:center;font-weight:800;font-size:34px}
.big{display:block;margin:20px 0 0;background:var(--g);color:#000;border-radius:18px;padding:16px;font-weight:800;font-size:18px}
.s5{background:radial-gradient(circle at 50% 62%,#e2b877 0,#9b4dff55 38%,#0b0b10 72%)}
.ring{position:absolute;left:50%;top:50%;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.tx{position:absolute;z-index:3;font-weight:800;letter-spacing:-.02em;line-height:1.06}
.w{display:inline-block;margin-right:.26em}.wi{display:inline-block}
.g{color:var(--g);text-shadow:0 0 40px rgba(226,184,119,.55)}
.card{position:absolute;left:0;top:0;z-index:7;display:flex;gap:16px;align-items:center;padding:20px 28px;border-radius:30px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 70px rgba(0,0,0,.5);font-size:28px;font-weight:700;line-height:1.15;white-space:nowrap}
.card small{display:block;font-size:19px;font-weight:400;color:#c9c9d4;margin-top:4px}
.card .dot{width:56px;height:56px;border-radius:18px;background:var(--g);color:#000;display:grid;place-items:center;font-size:26px;flex:none}
.card.q{white-space:normal;width:440px;font-size:26px}
#fan{position:absolute;inset:0;z-index:4}
.fp{position:absolute;left:0;top:0;width:400px;height:820px}
#fin{position:absolute;left:0;right:0;top:120px;text-align:center;z-index:6}
#fin .logo{margin:0 auto}
#tag{margin-top:34px;font-size:46px;font-weight:700;letter-spacing:-.01em}
#ctl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:20;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:30px;font-size:13px;backdrop-filter:blur(10px)}
#ctl button{background:#fff;color:#000;border:0;border-radius:20px;padding:6px 14px;font:700 13px 'Sora',system-ui,sans-serif;cursor:pointer}
#ctl input{width:220px;accent-color:#e2b877}
.scr{background:#141414!important}
.hd{display:flex;align-items:center;gap:12px;padding:16px 16px 0}.hd b{font-size:16px;flex:1}
.hb{width:30px;height:30px;border-radius:9px;border:1px solid #8a6a2e;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 7px;box-sizing:border-box}.hb i{height:2px;background:var(--g);border-radius:2px}
.cd{margin:16px 16px;border:1px solid #2b2b2b;border-radius:14px;padding:10px 10px 18px;text-align:center;background:radial-gradient(circle at 50% 0,#2a2214,transparent 60%)}
.cd img{width:100%;border-radius:10px;display:block}.cd b{display:block;margin-top:12px;font-size:14px}.cd small{display:block;margin-top:8px;color:#8a8a8a;font-size:11px;line-height:1.35}
.spl{position:absolute;inset:0;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px;z-index:3}
.bars{display:flex;gap:7px;align-items:flex-end;height:64px}.bars i{width:8px;border-radius:4px;background:#b8801f;height:var(--h);transform-origin:bottom;animation:wv .9s ease-in-out infinite alternate;animation-delay:var(--d)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.84)}
.mn{position:absolute;left:14px;right:14px;top:100px;background:#1e1e1e;border:1px solid #4a3a1c;border-radius:16px;padding:14px}
.mn .t{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.16em;color:var(--g);font-weight:700}
.mn .t span{border:1px solid #8a6a2e;border-radius:20px;padding:8px 14px;font-size:12px;letter-spacing:0}
.mn .it{margin-top:8px;border:1px solid #3a2f18;border-radius:10px;padding:13px 12px;font-size:13px;font-weight:700;background:#1b1b1b}
.bk{padding:14px 16px}.vt{display:inline-block;border:1px solid #8a6a2e;color:var(--g);border-radius:20px;padding:8px 12px;font-size:12px;font-weight:700}
.sr{margin:14px 0 12px;border:1px solid #3a2f18;border-radius:10px;background:#1c1c1c;padding:12px;color:#777;font-size:13px}
.ot{font-size:10px;letter-spacing:.14em;color:var(--g);font-weight:700;margin-bottom:8px}
.bi{display:flex;justify-content:space-between;border:1px solid #2f2a1e;border-radius:9px;background:#1c1c1c;padding:11px 12px;font-size:13px;font-weight:700;margin-bottom:7px}.bi em{color:var(--g);font-style:normal}
.bi.hl{background:#28221a;border-color:#8a6a2e}
</style>
</head>
<body>
<div id="view"><div id="stage">
  <div class="b" id="b1"></div><div class="b" id="b2"></div><div class="b" id="b3"></div>
  <div class="tx" id="t1" data-t="O Stronger Cast foi criado *PENSANDO* em *VOCÊ.*" style="left:140px;top:350px;width:880px;font-size:92px"></div>
  <div class="tx" id="t2" data-t="Assista e ouça aqui mesmo *pelo* *app.*" style="left:1030px;top:350px;width:780px;font-size:92px"></div>
  <div class="tx" id="t3" data-t="Conversas de verdade sobre ser *firme* num mundo que não para." style="left:140px;top:300px;width:900px;font-size:74px"></div>
  <div class="tx" id="t4" data-t="*Instale* direto pelo celular." style="left:1030px;top:350px;width:780px;font-size:100px"></div>
  <div class="tx" id="t5" style="left:140px;top:330px;width:900px"><div data-t="O intuito é simples:" style="font-size:62px;font-weight:600;color:#d8d8e2"></div><div data-t="*renovar.*" style="font-size:200px;margin-top:6px"></div></div>
  <div id="fan"></div>
  <div id="pw"><div id="tilt"><div id="fl"></div></div></div>
  <div id="fin"><div class="logo" style="--w:960px"><img class="lgi" alt="Stronger Cast"></div><div id="tag">Força, fé e expectativa pra essa geração.</div></div>
</div></div>
<div id="ctl"><button id="pp">Pausar</button><button id="rs">Reiniciar</button><input id="sc" type="range" min="0" max="30" step="0.01" value="0" aria-label="Linha do tempo"><span id="tm">0:00 / 0:30</span></div>

const bars=[40,64,55,24,50,64,46,34].map((h,i)=>`<i style="--h:${h}px;--d:${(i*.11).toFixed(2)}s"></i>`).join('');
const S={
1:f=>`<div class="scr s1">${sb}${hdr('Episódios')}${epi}${f?'':`<div class="spl">${logo(210)}<div class="bars">${bars}</div></div>`}</div>`,
2:()=>`<div class="scr s2">${sb}${hdr('Episódio')}<div class="pad"><div class="vid"><div class="play">▶</div></div><div class="pill"><i class="knob"></i><span>Assistir</span><span>Ouvir</span></div><div class="wave">${wave()}</div><div class="track"><i></i></div><div class="ctr"><span>⏮</span><span style="font-size:40px">⏸</span><span>⏭</span></div></div></div>`,
3:()=>`<div class="scr s3">${sb}${hdr('Episódios')}${epi}<div class="dim"></div><div class="mn"><div class="t">MENU<span>Fechar</span></div>${['Bíblia','Devocionais','Canais','Painel','Sua conta'].map((n,i)=>`<div class="it"${i==3?' style="color:var(--g)"':''}>${n}</div>`).join('')}</div></div>`,
4:d=>`<div class="scr s4"><div class="home">${'<div></div>'.repeat(16)}</div><div class="sheet"><div class="ico">SC</div><b style="font-size:24px">Stronger Cast</b><div style="color:#9a9aa6;margin-top:6px;font-size:15px">Adicionar à tela de início</div><div class="track" style="margin-top:26px"><i class="bar" style="width:${d?100:0}%"></i></div><span class="big btn4">${d?'Instalado ✓':'Instalar'}</span></div></div>`,
5:()=>`<div class="scr s5">${sb}<div class="bk"><span class="vt">← Voltar</span> <b style="font-size:18px;margin-left:8px">Bíblia</b><div class="sr">buscar livro...</div><div class="ot">ANTIGO TESTAMENTO</div>${['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas'].map(n=>`<div class="bi${n=='Levítico'?' hl':''}">${n}<em>›</em></div>`).join('')}</div></div>`
};
const phone=h=>`<div class="phone"><div class="e2"></div><div class="e1"></div><div class="body"></div><div class="glass"><div class="isl"></div>${h}</div></div>`;
document.getElementById('fl').innerHTML=phone([1,2,3,4,5].map(n=>S[n]()).join(''));
const main=document.getElementById('fl');
[2,3,4,5].forEach(n=>main.querySelector('.s'+n).style.opacity=0);
const order=[3,2,1,4,5];
document.getElementById('fan').innerHTML=order.map(n=>`<div class="fp">${phone(S[n](true))}</div>`).join('');
document.querySelectorAll('.lgi').forEach(i=>i.src=LOGO);document.querySelectorAll('.heroimg').forEach(i=>i.src=HERO);
// texto em palavras
document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=el.dataset.t.split(' ').map(w=>{const g=w[0]=='*';return `<span class="w"><span class="wi${g?' g':''}">${w.replace(/\*/g,'')}</span></span>`}).join('')});
const stage=document.getElementById('stage'),view=document.getElementById('view');
function fit(){const s=Math.min(view.clientWidth/1920,(view.clientHeight-56)/1080);stage.style.transform=`translate(${(view.clientWidth-1920*s)/2}px,${(view.clientHeight-56-1080*s)/2}px) scale(${s})`}
fit();addEventListener('resize',fit);
const $=s=>document.querySelector(s);
const pw=$('#pw'),tilt=$('#tilt');
gsap.set(pw,{xPercent:-50,yPercent:-50,x:1380,y:1500,scale:.8,transformPerspective:1600});
gsap.set(tilt,{rotationY:-40,rotationX:12});
gsap.set('#b1',{x:300,y:250});gsap.set('#b2',{x:1700,y:200});gsap.set('#b3',{x:1100,y:1000});
gsap.set('#fin',{autoAlpha:0});
gsap.set('.fp',{xPercent:-50,yPercent:-50,x:960,y:820,autoAlpha:0,scale:.3,transformOrigin:'50% 170%'});
gsap.to('#fl',{y:-16,rotationZ:1.2,duration:2.4,ease:'sine.inOut',yoyo:true,repeat:-1});
const cards=[];
function card(html,cls){const d=document.createElement('div');d.className='card '+(cls||'');d.innerHTML=html;stage.appendChild(d);gsap.set(d,{xPercent:-50,yPercent:-50,autoAlpha:0});cards.push(d);return d}
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
const tin=(s,t)=>tl.fromTo(s+' .wi',{y:70,autoAlpha:0,filter:'blur(22px)'},{y:0,autoAlpha:1,filter:'blur(0px)',duration:.9,stagger:.08},t);
const tout=(s,t)=>tl.to(s+' .wi',{autoAlpha:0,filter:'blur(26px)',y:-30,duration:.6,stagger:.03,ease:'power2.in'},t);
// cartões que saltam do celular: from=[x,y] do celular, to=[x,y]
function pop(c,from,to,t,out){tl.fromTo(c,{x:from[0],y:from[1],scale:.15,autoAlpha:0,filter:'blur(14px)',rotation:-8},{x:to[0],y:to[1],scale:1,autoAlpha:1,filter:'blur(0px)',rotation:0,duration:.9,ease:'back.out(1.7)'},t);
 if(out)tl.to(c,{autoAlpha:0,scale:.6,filter:'blur(18px)',x:from[0],y:from[1],duration:.5,ease:'power2.in'},out)}
function swap(a,b,t){tl.to(main.querySelector('.s'+a),{autoAlpha:0,filter:'blur(16px)',duration:.5},t).fromTo(main.querySelector('.s'+b),{autoAlpha:0,filter:'blur(16px)',scale:1.05},{autoAlpha:1,filter:'blur(0px)',scale:1,duration:.6},t)}
function move(x,y,sc,ry,t,d){tl.to(pw,{x,y,scale:sc,duration:d||1.2,ease:'power3.inOut'},t).to(tilt,{rotationY:ry,rotationX:8,duration:d||1.2,ease:'power3.inOut'},t)}
function bg(c1,c2,c3,t){tl.to('#b1',{x:c1[0],y:c1[1],duration:2.5,ease:'sine.inOut'},t).to('#b2',{x:c2[0],y:c2[1],duration:2.5,ease:'sine.inOut'},t).to('#b3',{x:c3[0],y:c3[1],duration:2.5,ease:'sine.inOut'},t)}
// CENA 1 (0–5)
tl.to(pw,{y:560,scale:1,duration:1.8,ease:'power3.out'},0).to(tilt,{rotationY:-18,rotationX:8,duration:1.8},0);
tin('#t1',.5);
const c1a=card('<div class="dot">▶</div><div>Episódios<small>Direto no app</small></div>'),c1b=card('<div class="dot">★</div><div>Em breve<small>Novos episódios por aqui</small></div>');
pop(c1a,[1380,500],[1090,300],2.3,4.5);pop(c1b,[1380,600],[1680,800],2.7,4.5);
tout('#t1',4.3);
tl.to(main.querySelector('.spl'),{autoAlpha:0,filter:'blur(18px)',duration:.8,ease:'power2.inOut'},3.2);
// CENA 2 (5–10)
move(540,560,1,18,4.7);swap(1,2,5.0);bg([300,800],[1500,250],[1700,900],4.7);
tin('#t2',5.6);
const c2a=card('<div class="dot">▶</div><div>Assistir<small>Vídeo completo</small></div>'),c2b=card('<div class="dot">♪</div><div>Ouvir<small>Só o áudio</small></div>');
pop(c2a,[540,500],[250,290],6.8,9.2);pop(c2b,[540,620],[830,830],7.2,9.2);
tl.to(main.querySelector('.knob'),{x:114,duration:.6,ease:'power2.inOut'},8.0);
tout('#t2',9.2);
// CENA 3 (10–16)
move(1380,560,1,-18,9.6);swap(2,3,9.9);bg([200,300],[1600,800],[900,1000],9.6);
tin('#t3',10.5);tout('#t3',13.4);
// zoom na tela
tl.to(pw,{x:960,y:700,scale:1.75,duration:1.3,ease:'power3.inOut'},13.5).to(tilt,{rotationY:0,rotationX:0,duration:1.3,ease:'power3.inOut'},13.5);
const c3=['Bíblia','Devocionais','Canais'].map(n=>card('<div class="dot">✦</div><div>'+n+'</div>'));
[[320,420],[1600,640],[1620,300]].forEach((p,i)=>pop(c3[i],[960,700],p,14.7+i*.3,15.7));
// CENA 4 (16–22)
move(540,560,1,18,15.7,1.1);swap(3,4,15.8);bg([1500,200],[300,900],[1400,1000],15.7);
tin('#t4',16.5);
const c4a=card('<div class="dot">⌁</div><div>Sem loja de apps<small>Instale pelo navegador</small></div>'),c4b=card('<div class="dot">1</div><div>Um toque<small>Pronto em segundos</small></div>');
pop(c4a,[540,500],[250,260],17.4,20.0);pop(c4b,[540,700],[840,860],17.8,20.0);
tl.to(main.querySelector('.bar'),{width:'100%',duration:1.4,ease:'power1.inOut'},18.4).add(()=>{},19.8);
tl.call(()=>{main.querySelector('.btn4').textContent=tl.time()>=19.8?'Instalado ✓':'Instalar'},null,19.8);
tout('#t4',19.9);
tl.to(pw,{x:960,y:380,scale:1.75,duration:1.2,ease:'power3.inOut'},20.0).to(tilt,{rotationY:0,rotationX:0,duration:1.2},20.0);
// CENA 5 (22–26)
move(1380,560,1,-18,21.4);swap(4,5,21.6);bg([300,300],[1500,700],[1000,900],21.4);
tl.to('#b1',{opacity:.8,duration:2},21.5);
tin('#t5',22.3);
const c5=[['Força',[1090,330]],['Fé',[1700,520]],['Expectativa',[1160,860]]].map(a=>card('<div class="dot">✦</div><div>'+a[0]+'</div>'));
c5.forEach((c,i)=>pop(c,[1380,560],[[1090,330],[1690,540],[1130,850]][i],23.3+i*.35,25.4));
tout('#t5',25.3);
// FINAL (26–30): leque + logo + tagline
tl.to(pw,{autoAlpha:0,scale:.5,filter:'blur(20px)',duration:.7,ease:'power2.in'},25.6);
bg([400,400],[1500,300],[960,950],25.6);
order.forEach((n,i)=>{const a=(i-2)*21;tl.to(`.fp:nth-child(${i+1})`,{autoAlpha:1,scale:.64,rotation:a,x:960,y:820,duration:1.1,ease:'back.out(1.3)'},26.0+Math.abs(i-2)*.12).fromTo(`.fp:nth-child(${i+1})`,{filter:'blur(18px)'},{filter:'blur(0px)',duration:.7},26.0+Math.abs(i-2)*.12)});
tl.fromTo('#fin',{autoAlpha:0,y:30,filter:'blur(22px)'},{autoAlpha:1,y:0,filter:'blur(0px)',duration:1.1},26.4);
tl.fromTo('#tag',{letterSpacing:'.2em'},{letterSpacing:'-.01em',duration:1.6,ease:'power2.out'},26.4);
tl.set({},{},30);
// controles
</script> 
</body>
</html>
